name: Feature request
description: Suggest a WindTrail improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should WindTrail do?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would this be useful?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Rendering / visual style
        - Settings UI
        - Performance
        - Compatibility / packaging
        - Documentation
        - Other
    validations:
      required: true
